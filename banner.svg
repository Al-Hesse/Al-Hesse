<svg width="100%" height="220" viewBox="0 0 1000 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .name-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      font-size: 40px;
      letter-spacing: 7px;
      fill: url(#textGrad);
      text-anchor: middle;
      dominant-baseline: central;
    }
    .sub-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 500;
      font-size: 14px;
      letter-spacing: 4px;
      fill: #94a3b8;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .tag-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 1.5px;
      fill: #38bdf8;
      text-anchor: middle;
      dominant-baseline: central;
    }
  </style>

  <!-- Background Card -->
  <rect width="1000" height="220" rx="14" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Grid decoration lines -->
  <line x1="40" y1="30" x2="960" y2="30" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="4 8" />
  <line x1="40" y1="190" x2="960" y2="190" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="4 8" />

  <!-- Main Name -->
  <text x="500" y="72" class="name-title">ALEXANDRE HESSE</text>

  <!-- Subtitle -->
  <text x="500" y="116" class="sub-title">DESENVOLVEDOR FULL STACK | BACKEND &amp; ARQUITETURA DE SISTEMAS</text>

  <!-- Animated Glowing Divider Line -->
  <rect x="350" y="140" width="300" height="2" fill="url(#lineGrad)" rx="1">
    <animate attributeName="width" values="200;420;200" dur="3.5s" repeatCount="indefinite" />
    <animate attributeName="x" values="400;290;400" dur="3.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3.5s" repeatCount="indefinite" />
  </rect>

  <!-- Tags -->
  <g transform="translate(500, 172)">
    <g transform="translate(-320, 0)">
      <rect x="-70" y="-13" width="140" height="26" rx="6" fill="#0f172a" stroke="#1e293b" />
      <text x="0" y="0" class="tag-text">JAVA &amp; SPRING</text>
    </g>
    <g transform="translate(-160, 0)">
      <rect x="-75" y="-13" width="150" height="26" rx="6" fill="#0f172a" stroke="#1e293b" />
      <text x="0" y="0" class="tag-text">PYTHON &amp; DJANGO</text>
    </g>
    <g transform="translate(0, 0)">
      <rect x="-70" y="-13" width="140" height="26" rx="6" fill="#0f172a" stroke="#1e293b" />
      <text x="0" y="0" class="tag-text">PHP &amp; LARAVEL</text>
    </g>
    <g transform="translate(160, 0)">
      <rect x="-70" y="-13" width="140" height="26" rx="6" fill="#0f172a" stroke="#1e293b" />
      <text x="0" y="0" class="tag-text">POSTGRESQL</text>
    </g>
    <g transform="translate(310, 0)">
      <rect x="-60" y="-13" width="120" height="26" rx="6" fill="#0f172a" stroke="#1e293b" />
      <text x="0" y="0" class="tag-text">DOCKER</text>
    </g>
  </g>
</svg>